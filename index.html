<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="home-div">
            <h1>HOME</h1>
            <div class="homeNumber-display">0</div>
            <div class="buttons-guest">
                <button class="plusone-h">+1</button>
                <button class="plusotwo-h">+2</button>    
                <button class="plusthree-h">+3</button>
            </div>
        </div>

        <div class="guest-div">
            <h1>GUEST</h1>
            <div class="guestNumber-display">0</div>
            <div class="buttons-guest">
                <button class="plusone-g">+1</button>
                <button class="plusotwo-g">+2</button>    
                <button class="plusthree-g">+3</button>
            </div>
            
        </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
